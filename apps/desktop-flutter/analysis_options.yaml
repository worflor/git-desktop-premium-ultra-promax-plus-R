# Analyzer configuration — tuned for the LLM write→analyze→fix loop.
#
# Goal: the analyzer catches genuine bugs *automatically*, so neither a human nor
# an LLM has to remember project conventions — you write code, run `dart
# analyze`, fix what it flags. To that end:
#   • strict language modes close the implicit-`dynamic` holes (Rust-adjacent);
#   • correctness lints with ZERO pre-existing violations are hard ERRORS, so the
#     bug class can never ship and the loop must resolve them;
#   • noisy/style lints are omitted so the error signal stays clean.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # No implicit-`dynamic` from failed inference; no raw generics. Low-noise,
    # high-value — both stay on.
    strict-inference: true
    strict-raw-types: true
    # No implicit dynamic→T casts. The JSON-decode casts this surfaces are made
    # explicit at their source (`j['x'] as String? ?? ''`), so it now also
    # catches every future implicit-dynamic assignment.
    strict-casts: true
  errors:
    # Real-bug lints with ~zero pre-existing hits → hard errors (free wins:
    # the bug class is blocked forever at no cleanup cost, no memorization).
    unrelated_type_equality_checks: error      # `1 == 'a'` — always-false
    collection_methods_unrelated_type: error   # `<int>[].contains('a')`
    throw_in_finally: error                     # swallows the in-flight throw
    literal_only_boolean_expressions: error     # `if (true && x)` dead logic
    body_might_complete_normally_catch_error: error
    cancel_subscriptions: error                 # StreamSubscription leak
    close_sinks: error                          # Sink/IOSink leak
    # no_adjacent_strings_in_list deliberately NOT here: measured 3 hits, all
    # intentional long-string line-wrapping inside a list (gh `--json` field
    # lists), zero real missing-commas — net-negative on this codebase.

linter:
  rules:
    # Genuine type / None / async bug catchers. Enabled at default severity
    # (warning) where there's existing debt — visible, fixed in-loop.
    unrelated_type_equality_checks: true
    collection_methods_unrelated_type: true
    avoid_dynamic_calls: true                   # blocks `dynamicValue.foo()`
    cast_nullable_to_non_nullable: true
    null_check_on_nullable_type_parameter: true
    unawaited_futures: true                     # un-awaited Future in async body
    cancel_subscriptions: true
    close_sinks: true
    throw_in_finally: true
    literal_only_boolean_expressions: true
    body_might_complete_normally_catch_error: true
    # discarded_futures intentionally OMITTED — 268 hits here, almost all
    # intentional fire-and-forget; unawaited_futures is the high-signal subset.
